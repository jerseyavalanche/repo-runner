[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-runner"
version = "0.2.0"
description = "Run open-source repositories in a controlled lab environment."
requires-python = ">=3.11"

[project.scripts]
repo-runner = "repo_runner.cli:main"
codex-telegram-bridge = "codex_telegram_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["codex_telegram_bridge"]
